name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        include:
          - os: windows-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - run: python -m pip install git+https://github.com/Virelion-Biotech/Virelion-CardiEP.git@40557b015f4391b3d48419b9b27af9e551ded05c
      - run: python -m compileall -q src
      - run: python -m ruff check src tests validation
      - run: python -m pytest -q --cov=cardiinfer --cov-report=term-missing --cov-fail-under=80
      - run: python -m cardiinfer doctor
      - run: python -m cardiinfer ecosystem
  scientific-cpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - run: python -m pip install git+https://github.com/Virelion-Biotech/Virelion-CardiEP.git@40557b015f4391b3d48419b9b27af9e551ded05c
      - run: python validation/run_cpu_validation.py --output validation/ci-results.json
      - run: python validation/run_cardiep_validation.py --output validation/ci-cardiep-results.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cpu-validation-results
          path: validation/ci-*.json
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip build
      - run: python -m build
      - run: python -m venv /tmp/cardiinfer-wheel
      - run: /tmp/cardiinfer-wheel/bin/python -m pip install --upgrade pip
      - run: /tmp/cardiinfer-wheel/bin/python -m pip install dist/*.whl pip-audit
      - run: /tmp/cardiinfer-wheel/bin/python -m pip_audit
      - run: cp validation/wheel_smoke.py /tmp/cardiinfer-wheel-smoke.py
      - name: Installed wheel outside the checkout
        working-directory: /tmp
        run: |
          /tmp/cardiinfer-wheel/bin/python -m cardiinfer doctor
          /tmp/cardiinfer-wheel/bin/python -m cardiinfer backends
          /tmp/cardiinfer-wheel/bin/python /tmp/cardiinfer-wheel-smoke.py
          /tmp/cardiinfer-wheel/bin/python -c "from cardiinfer import __version__; assert __version__ == '0.5.0'"
      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/*
  minimum-dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: python -m pip install -e . pytest pytest-cov hypothesis 'numpy==1.26.0' 'scipy==1.11.0' 'pydantic==2.6.0'
      - run: python -m pip install git+https://github.com/Virelion-Biotech/Virelion-CardiEP.git@40557b015f4391b3d48419b9b27af9e551ded05c
      - run: python -m pytest -q --cov=cardiinfer --cov-fail-under=80
